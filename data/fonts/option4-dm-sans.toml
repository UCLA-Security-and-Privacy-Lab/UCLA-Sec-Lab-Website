# Option 4: DM Sans + DM Serif Display
# 风格：标题衬线+正文无衬线，高端大气，适合研究机构
[heading]
google_fonts = "DM Serif Display:wght@400"
name = "DM Serif Display"

[body]
google_fonts = "DM Sans:ital,wght@0,400;0,500;0,700;1,400"
name = "DM Sans"

[monospace]
google_fonts = "JetBrains Mono:wght@400;700"
name = "JetBrains Mono"
