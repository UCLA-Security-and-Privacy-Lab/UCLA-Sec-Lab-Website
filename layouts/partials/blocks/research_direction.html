{{ $page := .wcPage }}
{{ $block := .wcBlock }}
{{ $title := $block.content.title | default "" }}

<div style="display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap;">
  {{ range $block.content.items }}
  <div style="flex: 1; min-width: 280px; max-width: 360px; text-align: center;">
    <h3 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">{{ .title }}</h3>
    {{ with .image }}
    {{ $image := resources.Get (printf "media/%s" .) }}
    {{ if $image }}
    <img src="{{ $image.RelPermalink }}" alt="{{ .title }}" style="width: 100%; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    {{ else }}
    <img src="{{ (printf "media/%s" .) | relURL }}" alt="{{ .title }}" style="width: 100%; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    {{ end }}
    {{ end }}
  </div>
  {{ end }}
</div>
