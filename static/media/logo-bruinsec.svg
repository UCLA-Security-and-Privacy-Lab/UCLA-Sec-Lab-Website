  <ellipse cx="240" cy="250" rx="12" ry="7" fill="#FFB81C"/>
  <ellipse cx="360" cy="250" rx="12" ry="7" fill="#FFB81C"/>
  <!-- muzzle -->
  <ellipse cx="300" cy="255" rx="41" ry="30" fill="#FFD100" stroke="#003B5C" stroke-width="4"/>
  <!-- brows over the shades: right one raised -->
  <path d="M244 190 Q262 184 280 190" fill="none" stroke="#003B5C" stroke-width="6" stroke-linecap="round"/>
  <path d="M322 186 Q340 172 358 180" fill="none" stroke="#003B5C" stroke-width="6" stroke-linecap="round"/>
  <!-- sunglasses -->
  <path d="M232 204 L368 204" stroke="#0b1620" stroke-width="6" stroke-linecap="round"/>
  <rect x="236" y="200" width="54" height="30" rx="11" fill="#0b1620"/>
