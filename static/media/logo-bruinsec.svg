  <path d="M258 108 Q300 98 342 108" fill="none" stroke="#2774AE" stroke-width="5" stroke-linecap="round"/>
  <path d="M184 322 C176 240 196 170 236 128" fill="none" stroke="#2774AE" stroke-width="6" stroke-linecap="round"/>
